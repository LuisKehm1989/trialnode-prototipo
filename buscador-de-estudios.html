.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
/* grises secundarios pensados para pasar contraste WCAG AA en texto chico */
#tn{--teal:#007567;--teal7:#005E53;--teal4:#60A9A0;--tint:#E6F1EF;--bg:#FAF8F7;--surf:#fff;--ink:#1A1A1A;--muted:#6B6B6B;--faint:#6E6E6E;--bd:#E2E2E2;--div:#E8E8E8;--font:'Poppins',system-ui,sans-serif;}
#tn *{box-sizing:border-box;font-family:var(--font);}
#tn .tnin{width:100%;height:50px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:#fff;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;}
#tn .tnin::placeholder{color:var(--muted);}
#tn .tnin:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--tint);}
#tn .cta:active{background:var(--teal7);transform:scale(.99);box-shadow:none;}
#tn .rcard{transition:box-shadow .18s,transform .12s;padding:15px;}
/* pantalla de resultados (mobile-first) */
#tn .matchb{display:inline-block;font-size:11px;font-weight:600;color:#005E53;background:#E6F1EF;padding:4px 11px;border-radius:999px;}
#tn .countb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 7px;border:1px solid #E2E2E2;border-radius:999px;font-size:12px;font-weight:600;color:#6B6B6B;background:#fff;}
#tn .res-head{display:flex;align-items:center;gap:9px;margin:2px 0 3px;}
#tn .res-h1{font-size:22px;font-weight:700;color:#1A1A1A;margin:0;}
#tn .res-sub{font-size:13px;color:#6B6B6B;margin:0 0 18px;}
#tn .rc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;}
#tn .rc-cond{font-size:11px;font-weight:500;color:#6B6B6B;}
#tn .rc-title{font-size:15px;font-weight:600;color:#1A1A1A;line-height:1.35;margin-bottom:11px;}
#tn .rc-meta{display:flex;gap:13px;align-items:center;margin-top:12px;font-size:11px;color:#6B6B6B;}
#tn .rc-tail{margin-left:auto;}
#tn .rc-applied{display:inline-flex;align-items:center;gap:4px;color:#007567;font-size:11px;font-weight:600;}
#tn .rc-chev{color:#007567;font-size:15px;}
/* pantalla de detalle (mobile-first) + escala tipográfica compartida vía .scr */
#tn .scr-h1{font-size:22px;font-weight:700;color:#1A1A1A;margin:11px 0 12px;line-height:1.3;}
#tn .scr-pill{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #E2E2E2;padding:5px 11px;border-radius:999px;font-size:11px;color:#6B6B6B;}
#tn .scr-eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6E6E6E;}
#tn .scr-li{display:flex;gap:9px;align-items:flex-start;margin-bottom:10px;font-size:13px;color:#1A1A1A;line-height:1.45;}
#tn .scr-note{font-size:12px;color:#6B6B6B;line-height:1.5;}
#tn .scr-body{font-size:13px;color:#1A1A1A;line-height:1.4;}
/* términos/privacidad: documento largo, columna angosta para que se lea bien */
#tn .legal-doc{max-width:720px;font-size:13px;line-height:1.65;color:#1A1A1A;}
#tn .legal-doc h2{font-size:16px;font-weight:700;color:#1A1A1A;margin:26px 0 10px;}
#tn .legal-doc h2:first-child{margin-top:0;}
#tn .legal-doc h3{font-size:14px;font-weight:700;color:#1A1A1A;margin:16px 0 8px;}
#tn .legal-doc p{margin:0 0 12px;}
#tn .legal-doc ul{margin:0 0 12px;padding-left:20px;}
#tn .legal-doc li{margin-bottom:6px;}
#tn .legal-row{margin:0 0 12px;padding:12px;background:#F6FAF9;border:1px solid #E6F1EF;border-radius:10px;}
#tn .legal-row-label{font-weight:600;font-size:13px;color:#1A1A1A;margin-bottom:4px;}
#tn .legal-meta{font-size:12px;color:#6B6B6B;margin-top:24px;}
#tn .rcard:active{transform:scale(.995);}
#tn .modalWrap{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(26,26,26,.42);animation:fadeIn .18s ease;}
#tn .modalCard{animation:pop .22s cubic-bezier(.2,.8,.3,1.1);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
/* estado de error de validación */
#tn .tnin.err{border-color:#C0392B;box-shadow:0 0 0 3px rgba(192,57,43,.12);}
#tn .fielderr{font-size:13px;color:#C0392B;margin-top:5px;line-height:1.35;display:flex;align-items:flex-start;gap:6px;}
#tn .fielderr::before{content:"!";flex:none;width:16px;height:16px;border-radius:50%;background:#C0392B;color:#fff;font-size:11px;font-weight:700;line-height:16px;text-align:center;margin-top:1px;}
#tn .slot-err{border-color:#C0392B !important;}
/* foco visible por teclado */
#tn button:focus-visible,#tn .tnin:focus-visible,#tn [tabindex]:focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
/* Layout responsivo real (reflujo por breakpoint, no mockup escalado).
   Mobile-first (una columna); desktop desde 860px. Contenido centrado hasta --maxw (1200px). */
html,body{margin:0;padding:0;background:#FAF8F7;}
#tn{background:#FAF8F7;--maxw:1200px;--pad:20px;position:relative;}
#tn #stage{position:relative;z-index:1;}  /* por encima de la malla de fondo (#tn-mesh) */
#tn #tn-topbar{background:#fff;border-bottom:1px solid #E8E8E8;position:sticky;top:0;z-index:50;}
#tn #navbar{max-width:var(--maxw);margin:0 auto;height:60px;display:flex;align-items:center;gap:6px;padding:0 var(--pad);}
#tn #viewport{max-width:var(--maxw);margin:0 auto;padding:24px var(--pad) 44px;min-height:calc(100dvh - 60px);}
#tn .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.03);}
/* footer: copyright + links legales. Mobile-first: apilado y centrado; fila en desktop (ver media 860). */
#tn #tn-footer{position:relative;z-index:1;background:transparent;border-top:1px solid #E8E8E8;flex:none;}
#tn .footer-in{max-width:var(--maxw);margin:0 auto;padding:16px var(--pad);display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;font-size:12px;color:var(--muted);}
#tn .footer-links{display:flex;flex-wrap:wrap;justify-content:center;gap:18px;}
#tn .footer-links button{border:none;background:transparent;padding:0;font-family:inherit;font-size:12px;color:var(--muted);cursor:pointer;-webkit-appearance:none;appearance:none;text-decoration:none;}
@media (hover:hover){ #tn .footer-links button:hover{color:var(--teal);text-decoration:underline;} }
/* intake: pitch + formulario */
/* minmax(0,1fr), no 1fr solo: sin esto, un grid item (ej. form-card con un nombre de archivo largo)
   puede estirar la columna más allá del ancho real disponible en vez de achicarse y truncar */
#tn .intake-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;}
#tn .form-card{background:#fff;border-radius:20px;box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.03);padding:20px 18px;}
#tn .pitch-title{font-size:26px;font-weight:700;color:#1A1A1A;line-height:1.2;margin:0 0 10px;}
#tn .pitch-br{display:none;}  /* el salto de línea del título solo se activa en desktop, ver media 860 */
#tn .pitch-sub{font-size:15px;color:#6B6B6B;line-height:1.6;margin:0 0 18px;max-width:46ch;}
#tn .pitch-steps{display:flex;flex-direction:column;gap:12px;margin:6px 0 2px;padding:0;list-style:none;}
#tn .pitch-steps li{display:flex;align-items:center;gap:12px;font-size:14px;color:#1A1A1A;}
#tn .pitch-steps .st-ic{flex:none;width:32px;height:32px;border-radius:9px;background:#E6F1EF;color:#007567;display:flex;align-items:center;justify-content:center;font-size:16px;}
#tn .pitch-badge{display:inline-flex;align-items:center;background:#E6F1EF;color:#005E53;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:6px 13px;border-radius:999px;margin:0 0 14px;align-self:flex-start;}
/* feedback visual al arrastrar un archivo sobre el dropzone */
#tn .up-wrap.drag .up-dropzone{border-color:#007567;border-style:solid;background:#EAF4F2;}
/* results: grilla de ensayos */
#tn .results-grid{display:grid;grid-template-columns:1fr;gap:14px;}
/* detail: contenido + panel lateral */
#tn .detail-grid{display:grid;grid-template-columns:1fr;gap:18px;}
#tn .centered-screen{max-width:460px;margin:0 auto;}
@media (min-width:600px){
  #tn .results-grid{grid-template-columns:repeat(2,1fr);}
}
@media (min-width:860px){
  /* Desktop: todo entra en 100dvh, sin scroll de página (shell de alto fijo). Excepción: pantallas largas (detail, terms, privacy), ver #tn.is-scrollable más abajo. */
  html,body{height:100%;}
  #tn{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  #tn #tn-topbar{flex:none;position:relative;z-index:5;}
  #tn .footer-in{flex-direction:row;align-items:center;justify-content:space-between;text-align:left;padding:14px var(--pad);}
  #tn #stage{flex:1 1 auto;min-height:0;position:relative;}
  #tn #viewport{height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding-top:24px;padding-bottom:24px;}

  /* intake: dos paneles que llenan el alto */
  #tn #viewport[data-screen="intake"]{justify-content:stretch;}
  /* grid-auto-rows:minmax(0,1fr) es lo que realmente limita la fila al alto disponible: sin esto,
     una fila "auto" crece con el contenido (ej. errores de validación) y se sale de #viewport,
     pisando lo que venga después (el footer). Con esto, form-card queda con un alto real y acotado. */
  #tn .intake-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);grid-auto-rows:minmax(0,1fr);gap:40px;align-items:stretch;flex:1 1 auto;min-height:0;}
  #tn .intake-pitch{display:flex;flex-direction:column;justify-content:center;gap:20px;min-height:0;padding:0 24px 0 48px;}
  #tn .pitch-title{font-size:42px;line-height:1.1;margin:0 0 12px;letter-spacing:-.01em;}
  #tn .pitch-br{display:inline;}
  #tn .pitch-sub{font-size:15px;margin:0;}
  #tn .pitch-steps{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none;}
  #tn .pitch-steps li{display:flex;align-items:center;gap:12px;font-size:14px;color:#1A1A1A;}
  #tn .pitch-steps .st-ic{flex:none;width:32px;height:32px;border-radius:9px;background:#E6F1EF;color:#007567;display:flex;align-items:center;justify-content:center;font-size:16px;}
  /* elementos alineados al top; el dropzone crece para llenar el alto sobrante */
  /* overflow-y:auto es el resguardo final si el contenido no entra en el alto disponible (mejor un
     scroll interno chico que contenido tapado o pisando el footer). El layout "compacto" (nombre y
     teléfono en fila) se activa por JS —fitIntakeForm()— midiendo overflow real, no por CSS: los
     container queries no reconocen bien el alto que da align-self:stretch desde un grid (probado). */
  #tn .form-card{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-start;padding:32px;overflow-y:auto;}
  #tn .name-phone-row > div{min-width:0;}
  #tn .form-card.compact .name-phone-row{display:flex;gap:14px;margin-bottom:16px;}
  #tn .form-card.compact .name-phone-row > div{flex:1 1 0;margin-bottom:0;}
  #tn .form-card .up-wrap{flex:1 1 auto;min-height:120px;display:flex;flex-direction:column;}
  #tn .form-card .up-wrap > *{flex:1 1 auto;height:auto;}
  #tn .form-card .up-dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;}
  #tn .form-card .up-filled{align-items:center;}

  /* resultados y detalle: alineados al top (no centrados verticalmente) */
  #tn #viewport[data-screen="results"], #tn #viewport[data-screen="detail"]{justify-content:flex-start;}

  #tn .results-grid{grid-template-columns:repeat(3,1fr);gap:22px;}

  /* escala tipográfica unificada en desktop entre resultados y detalle */
  #tn .scr .matchb{font-size:13px;padding:5px 14px;}     /* badge compatibilidad, igual en ambas */
  #tn .scr-h1{font-size:30px;margin:12px 0 14px;}        /* h1 del detalle */
  #tn .res-screen .res-h1{font-size:30px;}               /* h1 de resultados: mismo tamaño */
  #tn .res-screen .res-sub{font-size:16px;margin-bottom:26px;}
  #tn .res-screen .rcard{padding:26px;border-radius:16px;}
  #tn .res-screen .rc-title{font-size:19px;line-height:1.3;margin-bottom:14px;}
  #tn .res-screen .rc-cond{font-size:13px;}
  #tn .res-screen .rc-meta{font-size:15px;gap:16px;margin-top:18px;}
  #tn .res-screen .countb{min-width:28px;height:28px;font-size:15px;}
  #tn .res-screen .rc-applied{font-size:13px;}
  #tn .res-screen .rc-chev{font-size:19px;}
  /* detalle: mismos tamaños de rol que resultados */
  #tn .scr .scr-pill{font-size:13px;padding:6px 13px;}
  #tn .scr .scr-eyebrow{font-size:13px;}
  #tn .scr .scr-li{font-size:15px;margin-bottom:12px;}
  #tn .scr .scr-note{font-size:14px;}
  #tn .scr .scr-body{font-size:15px;}
  #tn .scr .legal-doc{font-size:15px;}
  #tn .detail-grid{grid-template-columns:1fr 300px;gap:32px;align-items:start;}
  #tn .detail-side{position:static;}

  /* CTA estable en intake: el wrap NO colapsa al cargar el archivo (si colapsara, el dropzone perdería
     su alto y el CTA "Buscar ensayos compatibles" saltaría de lugar). Se mantiene el mismo
     flex:1 1 auto/min-height:120px de siempre lleno o vacío; lo único que cambia es que el contenido
     cargado se centra en vez de estirarse para llenar el alto. */
  #tn .form-card .up-wrap.is-filled{justify-content:center;}
  #tn .form-card .up-wrap.is-filled > *{flex:0 0 auto;height:auto;}

  /* pantallas largas (detail, terms, privacy) salen del 100dvh sin scroll: el JS togglea is-scrollable
     en #tn (ver render()). El alto abraza el contenido con padding-bottom, y en detail el panel
     lateral del CTA queda sticky mientras se scrollea. */
  #tn.is-scrollable{height:auto;min-height:100dvh;overflow:visible;}
  #tn.is-scrollable #tn-topbar{position:sticky;top:0;}
  #tn.is-scrollable #stage{flex:none;overflow:visible;}
  #tn.is-scrollable #viewport{height:auto;min-height:0;overflow:visible;padding-bottom:48px;}
  #tn.is-scrollable .detail-side{position:sticky;top:84px;align-self:start;}  /* 84px = 60px navbar + 24px de aire */
}

/* malla de fondo: líneas rectas teal muy sutiles, atenuadas hacia arriba */
#tn-mesh{position:absolute;left:0;right:0;bottom:0;height:min(64%,560px);z-index:0;pointer-events:none;background-image:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIiBmaWxsPSJub25lIj48cGF0aCBkPSJNMCAwIEgxMDAgTTAgMCBWMTAwIiBzdHJva2U9IiMwMDc1NjciIHN0cm9rZS13aWR0aD0iMSIgc3Ryb2tlLW9wYWNpdHk9IjAuNTUiLz48L3N2Zz4=");background-position:left bottom;background-size:120px 120px;background-repeat:repeat;opacity:.30;-webkit-mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%);mask-image:linear-gradient(to top,#000 0%,#000 40%,transparent 100%);}

/* preloader: las letras del logo aparecen una por una, se funde cuando el sitio está listo */

  #tn-preloader{
    --bg:#FAF8F7;
    --ink:#020001;        /* negro del logo */
    --accent:#34A491;     /* teal de acento */
  }

  #tn-preloader{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    z-index:9999;
  }

  /* el logo escala solo: chico en mobile, tope en desktop */
  #tn-preloader .stage{
    position:relative;
    width:clamp(170px, 42vw, 340px);
    aspect-ratio:495 / 109;
  }

  #tn-preloader .stage svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
  }

  /* sin capa de fondo: arranca en blanco. Cada trazo (letra) aparece con fade-in + un pequeño
     desplazamiento de abajo hacia arriba, en cascada de izquierda a derecha. El SVG dibuja la "N"
     de Node en 3 trazos separados, por eso el orden de nth-child no es 1-a-1 con el orden visual:
     se reordena a mano abajo (T-r-i-a-l-N-N-N-o-d-e). */
  #tn-preloader .fill path{
    opacity:0;
    animation:tnLetterIn .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  #tn-preloader .fill path:nth-child(1){animation-delay:0ms;}     /* T */
  #tn-preloader .fill path:nth-child(2){animation-delay:70ms;}    /* r */
  #tn-preloader .fill path:nth-child(3){animation-delay:140ms;}   /* i */
  #tn-preloader .fill path:nth-child(4){animation-delay:210ms;}   /* a */
  #tn-preloader .fill path:nth-child(5){animation-delay:280ms;}   /* l */
  #tn-preloader .fill path:nth-child(9){animation-delay:350ms;}   /* N (trazo 1) */
  #tn-preloader .fill path:nth-child(11){animation-delay:420ms;}  /* N (trazo 2) */
  #tn-preloader .fill path:nth-child(10){animation-delay:490ms;}  /* N (trazo 3) */
  #tn-preloader .fill path:nth-child(6){animation-delay:560ms;}   /* o */
  #tn-preloader .fill path:nth-child(7){animation-delay:630ms;}   /* d */
  #tn-preloader .fill path:nth-child(8){animation-delay:700ms;}   /* e */
  #tn-preloader .fill path:nth-child(n+12){animation-delay:900ms;} /* subtítulo: entra junto, ya de fondo */

  @keyframes tnLetterIn{
    0%   { opacity:0; transform:translateY(12px); }
    100% { opacity:1; transform:translateY(0); }
  }

  /* respeta a quien apaga animaciones: muestra el logo entero y quieto, sin cascada */
  @media (prefers-reduced-motion: reduce){
    #tn-preloader .fill path{ animation:none; opacity:1; transform:none; }
  }

#tn-preloader{transition:opacity .5s ease;}
#tn-preloader.tn-hide{opacity:0;pointer-events:none;}

/* el fondo del CTA vive en la clase, no inline, para que :hover/:active del CSS puedan pisarlo */
#tn .cta{background:var(--teal);color:#fff;}
#tn .btn-ghost{background:#fff;}
/* misma sombra que .form-card (pantalla 1), fija: no crece al hacer hover, solo se levanta un poco */
#tn .rcard{box-shadow:0 1px 3px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.03);}
#tn .navbtn{border:none;background:transparent;border-radius:8px;transition:background .15s;}
@media (hover:hover){
  #tn .cta:hover{background:#006A5D;}
  #tn .rcard:hover{transform:translateY(-2px);}
  #tn .btn-ghost:hover{background:#F4F4F4;}
  #tn .navbtn:hover{background:#F1F1F1;}
  #tn .crumb-link:hover{color:var(--teal);}
  #tn .share-btn:hover{background:#F1F5F4;border-color:#CFE0DC;color:var(--teal);}
  #tn .lang-dd-btn:hover{background:#EDEDED;}
  #tn .lang-opt:hover:not(.active){background:#F1F1F1;}
}
/* selector de idioma como dropdown: un segmentado de 3 botones fijos no entraba en mobile
   (back 44px + logo ~152px + segmentado ~178px > 390px de viewport). Un botón compacto en la
   navbar abre un menú flotante con las 3 opciones. Misma lógica de idioma (lang / I18N / t() / render). */
#tn .lang-dd{position:relative;margin-left:auto;flex:none;}
#tn .lang-dd-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid #E8E8E8;background:#fff;color:#1A1A1A;font-size:12px;font-weight:600;letter-spacing:.02em;padding:8px 10px;min-height:36px;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none;line-height:1;transition:background .15s;}
#tn .lang-dd-code{line-height:1;}
#tn .lang-dd-chev{font-size:10px;color:#6B6B6B;transform:rotate(90deg);transition:transform .15s;}
#tn .lang-dd-btn[aria-expanded="true"] .lang-dd-chev{transform:rotate(-90deg);}
#tn .lang-dd-menu{position:absolute;top:calc(100% + 6px);right:0;margin:0;padding:4px;list-style:none;min-width:132px;background:#fff;border:1px solid #E2E2E2;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:60;}
#tn .lang-opt{display:flex;align-items:center;gap:8px;width:100%;border:none;background:transparent;color:#1A1A1A;font-size:13px;font-weight:500;padding:9px 10px;border-radius:6px;cursor:pointer;-webkit-appearance:none;appearance:none;text-align:left;}
#tn .lang-opt.active{background:#E6F1EF;color:#005E53;font-weight:600;}
#tn .lang-opt .ti-check{margin-left:auto;color:#007567;font-size:13px;}
#tn .lang-flag{display:block;width:18px;height:13px;border-radius:2px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08);flex:none;}
#tn .lang-flag svg{display:block;width:100%;height:100%;}
/* breadcrumbs arriba del título de cada página, solo desktop.
   El back arrow queda solo en mobile (su display lo maneja el CSS, no inline). */
#tn .nav-back{display:flex;align-items:center;justify-content:center;}
#tn .page-crumbs{display:none;}
@media (min-width:860px){
  #tn .nav-back{display:none;}   /* redundante con las migas en desktop */
  #tn .page-crumbs{display:flex;align-items:center;gap:8px;margin-bottom:16px;min-width:0;}
  #tn .crumb{font-size:13px;line-height:1;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #tn .crumb-link{border:none;background:transparent;color:#6B6B6B;cursor:pointer;padding:0;-webkit-appearance:none;appearance:none;transition:color .15s;}
  #tn .crumb-cur{color:#1A1A1A;font-weight:600;}
  #tn .crumb-sep{color:#B7B7B7;font-size:14px;flex:none;}
}
/* fila superior del detalle + botón compartir */
#tn .detail-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;}
#tn .share-btn{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #E2E2E2;color:#1A1A1A;font-size:13px;font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .15s,border-color .15s,color .15s;flex:none;}
#tn .share-btn svg{display:block;}
/* panel de acción del detalle (responsable / CTA) */
#tn .side-div{height:1px;background:#E8E8E8;margin:14px 0;}
#tn .side-note{font-size:12px;color:#6B6B6B;line-height:1.5;margin-top:12px;text-align:center;}
/* toast de "enlace copiado" */
#tn #tn-toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,14px);background:#1A2B28;color:#fff;font-size:13px;font-weight:500;padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;z-index:1200;}
#tn #tn-toast.show{opacity:1;transform:translate(-50%,0);}
/* botón flotante "volver arriba" en las pantallas legales (documentos largos) */
#tn .scroll-top-btn{position:fixed;right:20px;bottom:24px;width:48px;height:48px;border-radius:50%;background:var(--teal);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18);z-index:40;-webkit-appearance:none;appearance:none;}
#tn .scroll-top-btn i{transform:rotate(-90deg);display:block;}
@media (hover:hover){ #tn .scroll-top-btn:hover{background:#006A5D;} }

/* nota de preselección sobre el % de compatibilidad */
#tn .res-nota{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:#6B6B6B;line-height:1.5;margin:-8px 0 18px;}
#tn .res-nota .ti{color:#007567;font-size:9px;margin-top:5px;flex:none;}
/* botón de idioma a 44px de alto (mínimo táctil recomendado) */
#tn .lang-dd-btn{min-height:44px;}
/* mapa de ubicación del centro (mock offline + botón a Google Maps) */
#tn .map-mock{position:relative;height:170px;border-radius:12px;overflow:hidden;border:1px solid #E2E2E2;}
#tn .map-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
#tn .map-pin{position:absolute;top:50%;left:50%;transform:translate(-50%,-100%);color:#007567;font-size:30px;line-height:1;filter:drop-shadow(0 3px 3px rgba(0,0,0,.28));}
#tn .map-pin::after{content:"";position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);width:13px;height:5px;border-radius:50%;background:rgba(0,0,0,.20);}
#tn .map-loc{position:absolute;left:10px;bottom:10px;max-width:82%;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;color:#1A1A1A;box-shadow:0 2px 6px rgba(0,0,0,.14);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#tn .map-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;}
#tn .map-note{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#6B6B6B;}
#tn .map-note .ti{font-size:9px;color:#007567;}
#tn .map-btn{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #E2E2E2;color:#007567;font-size:13px;font-weight:600;padding:8px 13px;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none;flex:none;transition:background .15s,border-color .15s;}
#tn .map-btn .ti-chevron-right{font-size:12px;}
@media (hover:hover){ #tn .map-btn:hover{background:#F1F5F4;border-color:#CFE0DC;} }
/* carga real de archivo/foto (input con capture) */
#tn .up-dropzone{display:block;}
#tn .up-dropzone:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--tint);}

/* pantalla de análisis: radar (pulsos expansivos) + ADN formándose en el centro */
#tn .an-stage{position:relative;width:80px;height:80px;display:flex;align-items:center;justify-content:center;}
#tn .an-ring{position:absolute;width:100%;height:100%;border-radius:50%;border:2px solid var(--teal);animation:anPing 3.2s cubic-bezier(0,.5,.5,1) infinite;}
#tn .an-ring:nth-child(2){animation-delay:1.6s;}
#tn .an-core{position:relative;width:56px;height:56px;border-radius:50%;background:var(--tint);display:flex;align-items:center;justify-content:center;}
#tn .an-dna path{stroke-dasharray:1;stroke-dashoffset:1;animation:anDnaDraw 3.6s ease-in-out infinite;}
#tn .an-dna line{opacity:0;animation:anRung 3.6s ease-in-out infinite;}
#tn .an-dna line:nth-child(1){animation-delay:1.05s;}
#tn .an-dna line:nth-child(2){animation-delay:1.25s;}
#tn .an-dna line:nth-child(3){animation-delay:1.45s;}
#tn .an-dna line:nth-child(4){animation-delay:1.65s;}
@keyframes anPing{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(1.5);opacity:0;}}
@keyframes anDnaDraw{0%{stroke-dashoffset:1;opacity:1;}30%{stroke-dashoffset:0;opacity:1;}70%{stroke-dashoffset:0;opacity:1;}88%{opacity:0;}100%{stroke-dashoffset:1;opacity:0;}}
@keyframes anRung{0%{opacity:0;transform:scaleX(0);}40%{opacity:1;transform:scaleX(1);}75%{opacity:1;transform:scaleX(1);}90%{opacity:0;}100%{opacity:0;transform:scaleX(0);}}
@media (prefers-reduced-motion: reduce){
  #tn .an-ring{animation:none;opacity:0;}
  #tn .an-dna path{animation:none;stroke-dashoffset:0;opacity:1;}
  #tn .an-dna line{animation:none;opacity:1;transform:none;}
}
</style>

  // breadcrumbs (solo se ven en desktop por CSS) + back (solo mobile por CSS)
  function crumbLink(label, act){ return '<button class="crumb crumb-link" data-act="'+act+'">'+label+'</button>'; }
  function crumbCur(label){ return '<span class="crumb crumb-cur" aria-current="page">'+label+'</span>'; }
  function crumbSep(){ return '<span class="crumb-sep" aria-hidden="true">›</span>'; }
  // breadcrumbs arriba del título de cada pantalla (solo results/detail; en inicio no sirve). Desktop-only por CSS.
  function pageCrumbs(screen, arg){
    var p=[];
    if(screen==='results'){ p.push(crumbLink(t('nav_inicio'),'intake')); p.push(crumbSep()); p.push(crumbCur(t('nav_ensayos'))); }
    else if(screen==='detail'){
      var tr=trials.filter(function(x){return x.id==arg;})[0];
      p.push(crumbLink(t('nav_inicio'),'intake')); p.push(crumbSep());
      p.push(crumbLink(t('nav_ensayos'),'results')); p.push(crumbSep());
      p.push(crumbCur(tr?tr.title:''));
    }
    else if(screen==='terms'){ p.push(crumbLink(t('nav_inicio'),'intake')); p.push(crumbSep()); p.push(crumbCur(t('footer_terms'))); }
    else if(screen==='privacy'){ p.push(crumbLink(t('nav_inicio'),'intake')); p.push(crumbSep()); p.push(crumbCur(t('footer_privacy'))); }
    else { return ''; }
    return '<nav class="page-crumbs" aria-label="'+t('crumbs_aria')+'">'+p.join('')+'</nav>';
  }

  // selector de idioma como dropdown: un botón compacto (bandera + código + chevron) que abre un
  // menú flotante, así entra en mobile. Misma lógica de idioma: lang / I18N / t() / TRIALS / render().
  var langMenuOpen = false;
  function langDropdown(){
    var codes=['es','en','pt'];
    var flagCode={ es:'es', en:'us', pt:'pt' };  // EN muestra EEUU
    var opts = codes.map(function(c){
      var sel = c===lang;
      return '<li role="none"><button type="button" class="lang-opt'+(sel?' active':'')+'" role="menuitemradio" aria-checked="'+sel+'" data-act="setLang" data-arg="'+c+'" lang="'+c+'"><span class="lang-flag" aria-hidden="true">'+FLAGS[flagCode[c]]+'</span><span>'+c.toUpperCase()+'</span>'+(sel?'<i class="ti ti-check" aria-hidden="true"></i>':'')+'</button></li>';
    }).join('');
    var menu = langMenuOpen
      ? '<ul class="lang-dd-menu" role="menu" aria-label="'+t('idioma_aria')+'">'+opts+'</ul>'
      : '';
    return '<div class="lang-dd">'+
      '<button type="button" class="lang-dd-btn" data-act="toggleLangMenu" aria-haspopup="true" aria-expanded="'+langMenuOpen+'" aria-label="'+t('idioma_aria')+'">'+
        '<span class="lang-flag" aria-hidden="true">'+FLAGS[flagCode[lang]]+'</span><span class="lang-dd-code">'+lang.toUpperCase()+'</span>'+
        '<i class="ti ti-chevron-right lang-dd-chev" aria-hidden="true"></i>'+
      '</button>'+menu+
    '</div>';
  }

  function renderNav(screen, arg){
    var back = backMap[screen];
    // el display lo maneja el CSS (.nav-back): flex en mobile, none en desktop (no inline, que le ganaba a la regla).
    var backBtn = back
      ? '<button class="navbtn nav-back" data-act="'+back+'" aria-label="'+t('nav_volver')+'" style="width:44px;height:44px;color:#1A1A1A;font-size:20px;cursor:pointer;align-items:center;justify-content:center;-webkit-appearance:none;appearance:none;flex:none;margin-left:-8px;"><i class="ti ti-arrow-left"></i></button>'
      : '';
    nav.innerHTML = backBtn
      + '<div class="nav-logo" style="display:flex;align-items:center;flex:none;">'+LOGO+'</div>'
      + langDropdown();
  }

  // el CTA no trae background inline, así el hover/active del CSS toma efecto
  function cta(label, act, arg){
    var a = (arg!=null) ? ' data-arg="'+arg+'"' : '';
    return '<button class="cta" data-act="'+act+'"'+a+' style="display:block;width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none;font-weight:700;font-size:15px;line-height:1;padding:15px;border:none;border-radius:8px;cursor:pointer;transition:background .15s,box-shadow .15s,transform .1s;">'+label+'</button>';
  }
  // <label for> real, aria-required, type/inputmode/autocomplete, value preservado y estado de error
  function field(id, label, ph, req, opts){
    opts = opts || {};
    var star = req ? ' <span style="color:var(--teal);" aria-hidden="true">*</span><span class="sr-only"> '+t('req')+'</span>' : '';
    var attrs = '';
    if(opts.type) attrs += ' type="'+opts.type+'"';
    if(opts.inputmode) attrs += ' inputmode="'+opts.inputmode+'"';
    if(opts.autocomplete) attrs += ' autocomplete="'+opts.autocomplete+'"';
    if(req) attrs += ' aria-required="true"';
    var val = opts.value ? ' value="'+String(opts.value).replace(/"/g,'&quot;')+'"' : '';
    var errCls = opts.error ? ' err' : '';
    var errMsg = opts.error ? '<div class="fielderr" id="'+id+'-err" role="alert">'+opts.error+'</div>' : '';
    var descBy = opts.error ? ' aria-describedby="'+id+'-err"' : '';
    return '<div style="margin-bottom:16px;">'+
      '<label for="'+id+'" style="display:block;font-size:13px;font-weight:500;color:var(--ink);margin-bottom:6px;">'+label+star+'</label>'+
      '<input id="'+id+'" class="tnin'+errCls+'"'+attrs+val+descBy+' placeholder="'+ph+'"/>'+
      errMsg+'</div>';
  }
  function sectionTitle(x){ return '<div style="display:flex;align-items:center;gap:10px;margin:0 0 13px;"><span class="scr-eyebrow" style="white-space:nowrap;">'+x+'</span><span style="flex:1;height:1px;background:#E8E8E8;"></span></div>'; }

      '<div class="modalWrap" data-act="successBg">'+
        '<div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="sc-t" style="background:#fff;border-radius:20px;padding:clamp(26px,3.4vw,34px);text-align:center;width:min(90vw,380px);box-shadow:0 12px 40px rgba(0,0,0,.18);">'+
          '<div style="width:58px;height:58px;border-radius:50%;background:#E6F1EF;display:flex;align-items:center;justify-content:center;color:#007567;font-size:28px;margin:0 auto 16px;"><i class="ti ti-check"></i></div>'+
          '<div id="sc-t" style="font-size:18px;font-weight:600;color:#1A1A1A;margin-bottom:8px;">'+t('sc_title')+'</div>'+
          '<p style="font-size:14px;color:#6B6B6B;line-height:1.55;margin:0 0 22px;text-wrap:pretty;">'+t('sc_ba')+'<span style="color:#1A1A1A;font-weight:500;">'+(formData.contacto||t('contacto_fb'))+'</span>'+t('sc_bb')+'</p>'+
          '<button class="cta" data-act="doneApply" data-autofocus style="display:block;width:100%;box-sizing:border-box;font-weight:700;font-size:15px;padding:15px;border:none;border-radius:8px;cursor:pointer;-webkit-appearance:none;appearance:none;transition:background .15s,box-shadow .15s,transform .1s;">'+t('sc_done')+'</button>'+
        '</div>'+
      '</div>';
    focusModal();
  }
  function closeModal(){ modalLayer.innerHTML=''; modalType=null; }
  // al terminar el flujo se vuelve a la pantalla inicial con el estado reseteado
  function resetHome(){ formData={}; formErrors={}; uploaded=false; uploadedName='historia-clinica.pdf'; uploadedPreview=null; applied={}; closeModal(); render('intake'); }

  // compartir: prototipo, link simulado (no hay backend). Share nativo o copia al portapapeles + toast.
  function copyText(s){
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(s); return; } }catch(e){}
    try{ var ta=document.createElement('textarea'); ta.value=s; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }catch(e){}
  }
  var toastTimer=null;
  function toast(msg){
    var el=document.getElementById('tn-toast');
    if(!el){ el=document.createElement('div'); el.id='tn-toast'; document.getElementById('tn').appendChild(el); }
    el.textContent=msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){ el.classList.remove('show'); },1900);
  }
  function shareStudy(id){
    var x=trials.filter(function(y){return y.id==id;})[0];
    var url='https://trialnode.app/estudio/'+id; // simulado: no existe backend (prototipo)
    if(navigator.share){ navigator.share({title:'TrialNode', text:(x?x.title:''), url:url}).catch(function(){}); return; }
    copyText(url); toast(t('enlace_copiado'));
  }

  // abre Google Maps buscando la ubicación del centro. Comportamiento real (no simulado), pero a
  // nivel zona: los centros son ficticios, no hay coordenadas exactas (no se inventa dirección).
  function openMap(id){
    var x=trials.filter(function(y){return y.id==id;})[0]; if(!x) return;
    var q=encodeURIComponent(x.loc.replace(/ · /g,' '));
    try{ window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank','noopener'); }catch(e){}
  }

  var current='intake';
  var currentArg=null;
  // desktop: si el formulario del intake no entra en el alto disponible (mensajes de error, laptop
  // bajo), pasa nombre/teléfono a una fila para ganar espacio vertical. Mide overflow real en vez de
  // un umbral de CSS: los container queries no reflejan bien el alto que da align-self:stretch (probado).
  function fitIntakeForm(){
    var card = vp.querySelector('.form-card');
    if(!card) return;
    card.classList.remove('compact');
    if(window.innerWidth >= 860 && card.scrollHeight > card.clientHeight + 1) card.classList.add('compact');
  }

  function render(name, arg){
    current=name; currentArg=arg;
    closeModal();
    vp.setAttribute('data-screen', name);
    // solo en detail el shell abraza el contenido (deja el 100dvh sin scroll); intake/results
    // conservan el comportamiento de siempre
    if(tnRoot) tnRoot.classList.toggle('is-scrollable', name==='detail'||name==='terms'||name==='privacy');
    if(name==='intake') vp.innerHTML=screenIntake();
    else if(name==='analyze'){ vp.innerHTML=screenAnalyzing(); startSteps(); }
    else if(name==='results') vp.innerHTML=screenResults();
    else if(name==='detail') vp.innerHTML=screenDetail(arg);
    else if(name==='terms') vp.innerHTML=screenTerms();
    else if(name==='privacy') vp.innerHTML=screenPrivacy();
    renderNav(name, arg);
    renderFooter();
    fitIntakeForm();
  }
  // valida los campos obligatorios y, si están OK, pide el consentimiento en un modal (ver openConsent)
  function validateAndAnalyze(){
    var nombreEl=document.getElementById('f-nombre');
    var contactoEl=document.getElementById('f-contacto');
    formData.nombre = nombreEl ? nombreEl.value.trim() : '';
    formData.contacto = contactoEl ? contactoEl.value.trim() : '';
    formErrors = {};
    if(!formData.nombre) formErrors.nombre=t('err_nombre');
    var esMail=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(formData.contacto);
    var esTel=formData.contacto.replace(/\D/g,'').length>=6;
    if(!formData.contacto) formErrors.contacto=t('err_contacto_empty');
    else if(!esMail && !esTel) formErrors.contacto=t('err_contacto_bad');
    if(!uploaded) formErrors.upload=t('err_upload');
    if(Object.keys(formErrors).length){
      vp.innerHTML=screenIntake();
      fitIntakeForm();
      // lleva al usuario al primer campo con error y lo enfoca, para que no quede trabado sin ver por qué
      var firstInput = vp.querySelector('.tnin.err');
      var firstErr = firstInput || vp.querySelector('.fielderr');
      if(firstErr && firstErr.scrollIntoView) firstErr.scrollIntoView({behavior:'smooth', block:'center'});
      if(firstInput && firstInput.focus) firstInput.focus({preventScroll:true});
      return;
    }
    openConsent();
  }

  function handle(e){
    var el=e.target.closest('[data-act]'); if(!el) return;
    var act=el.getAttribute('data-act');
    // cambio de idioma: reemplaza data y re-renderiza la pantalla actual. Siempre cierra el dropdown
    // y re-renderiza (incluso si tocás el idioma ya activo), para que el menú no quede abierto colgado.
    if(act==='setLang'){
      var L=el.getAttribute('data-arg');
      langMenuOpen=false;
      if(L!==lang && I18N[L]){ lang=L; trials=TRIALS[lang]; document.documentElement.lang=lang; }
      render(current, currentArg);
      return;
    }
    // abre/cierra el menú del dropdown de idioma sin tocar el resto de la pantalla
    if(act==='toggleLangMenu'){
      langMenuOpen=!langMenuOpen;
      renderNav(current, currentArg);
      var ddBtn=nav.querySelector('.lang-dd-btn'); if(ddBtn) ddBtn.focus();
      return;
    }
    if(act==='removeUpload'){ uploaded=false; uploadedPreview=null; uploadedName='historia-clinica.pdf'; if(formErrors.upload) delete formErrors.upload; renderSlot(); return; }
    if(act==='analyze'){ validateAndAnalyze(); return; }
    if(act==='share'){ shareStudy(el.getAttribute('data-arg')); return; }
    if(act==='openMap'){ openMap(el.getAttribute('data-arg')); return; }
    if(act==='scrollTop'){ window.scrollTo({top:0, behavior:'smooth'}); return; }
    if(act==='apply'){ openConfirm(el.getAttribute('data-arg')); return; }
    if(act==='confirmApply'){ applied[el.getAttribute('data-arg')]=true; openSuccess(); return; }
    if(act==='confirmConsent'){ closeModal(); render('analyze'); return; }
    if(act==='doneApply'){ resetHome(); return; }
    if(act==='successBg'){ if(e.target===el){ resetHome(); } return; }
    if(act==='goHome'){ resetHome(); return; }
    if(act==='closeModalBg'){ if(e.target===el || el.tagName==='BUTTON') closeModal(); return; }
    render(act, el.getAttribute('data-arg'));
  }
  vp.addEventListener('click', handle); nav.addEventListener('click', handle); modalLayer.addEventListener('click', handle); footerEl.addEventListener('click', handle);

  // drag & drop en el dropzone (prototipo: toma el nombre real, no sube nada)
  function dropZone(e){ return e.target.closest ? e.target.closest('.up-wrap') : null; }
  function renderSlot(){ var slot=document.getElementById('uploadSlot'); if(slot){ slot.innerHTML=uploadSlot(); slot.classList.toggle('is-filled', uploaded); } }
  // toma el archivo (foto o PDF), marca cargado al instante y —si es imagen— carga el preview real (async). No sube nada (prototipo).
  function acceptFile(f){
    uploadedName = (f && f.name) ? f.name : 'historia-clinica.pdf';
    uploaded = true; uploadedPreview = null;
    if(formErrors.upload) delete formErrors.upload;
    renderSlot();
    if(f && f.type && f.type.indexOf('image/')===0 && typeof FileReader!=='undefined'){
      var r=new FileReader(); r.onload=function(){ uploadedPreview=r.result; renderSlot(); }; try{ r.readAsDataURL(f); }catch(e){}
    }
  }
  // el input real dispara 'change' al elegir/sacar la foto
  vp.addEventListener('change', function(e){
    var inp=e.target; if(!inp || inp.id!=='hc-file' || !inp.files || !inp.files.length) return;
    acceptFile(inp.files[0]);
  });
  vp.addEventListener('dragover', function(e){ var z=dropZone(e); if(z){ e.preventDefault(); if(e.dataTransfer) e.dataTransfer.dropEffect='copy'; z.classList.add('drag'); } });
  vp.addEventListener('dragleave', function(e){ var z=dropZone(e); if(z && !z.contains(e.relatedTarget)) z.classList.remove('drag'); });
  vp.addEventListener('drop', function(e){
    var z=dropZone(e); if(!z) return;
    e.preventDefault(); z.classList.remove('drag');
    acceptFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  // los pasos avanzan una sola vez y se detienen (nada de loop infinito)
  var stepTimer=null;
  function startSteps(){
    clearInterval(stepTimer);
    var steps=[t('an1'),t('an2'),t('an3'),t('an4')];
    var si=0;
    stepTimer=setInterval(function(){
      var s=document.getElementById('step');
      if(!s || current!=='analyze'){ clearInterval(stepTimer); return; }
      if(si < steps.length-1){ si++; s.textContent=steps[si]; }
      else { clearInterval(stepTimer); }
    }, 800);
  }

  // Escape cierra el modal abierto, o si no hay modal, el dropdown de idioma
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape' && modalType){
      if(modalType==='success'){ resetHome(); }
      else closeModal();
      return;
    }
    if(e.key==='Escape' && langMenuOpen){ langMenuOpen=false; renderNav(current, currentArg); }
  });

  // click afuera del dropdown de idioma lo cierra (patrón estándar de menú)
  document.addEventListener('click', function(e){
    if(langMenuOpen && !e.target.closest('.lang-dd')){ langMenuOpen=false; renderNav(current, currentArg); }
  });

  // si la ventana cambia de tamaño en vivo (redimensionar el navegador), re-mide el intake.
  window.addEventListener('resize', function(){ if(current==='intake') fitIntakeForm(); });

  render('intake');
})();
</script>
<script>
(function(){
  var pl=document.getElementById("tn-preloader"); if(!pl) return;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var wait=reduce?1000:2300; // ~1450ms lo que tarda en aparecer todo el logo letra por letra + un sostén corto
  setTimeout(function(){
    pl.classList.add("tn-hide");
    setTimeout(function(){ if(pl.parentNode) pl.parentNode.removeChild(pl); },550);
  },wait);
})();
</script>
</body>
